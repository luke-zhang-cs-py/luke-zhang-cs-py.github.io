name: checks

on:
  push:
  pull_request:

jobs:
  site:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 October
    # 2026, and a runner image changing under the job is a failure with no
    # code change behind it. Move this on purpose, after a green run.
    runs-on: ubuntu-24.04
    # Well past what this job takes; a stuck run fails here instead of
    # after GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser checks (structure, demos, layout, dark mode, links, privacy)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the commits check reads the GitHub API
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python tests/check_site.py
