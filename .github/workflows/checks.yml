name: checks

on:
  push:
  pull_request:

jobs:
  site:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 19 October
    # 2026, and a runner image changing under the job is a failure with no
    # code change behind it. Move this on purpose, after a green run.
    runs-on: ubuntu-24.04
    # Well past what this job takes; a stuck run fails here instead of
    # after GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # tools/ against stand-ins for Playwright and Pillow; .coveragerc's fail_under
      # makes `coverage report` exit 1 below 100% of lines and branches.
      - name: Python tests, 100% line and branch coverage
        run: |
          python -m coverage run -m pytest -q tests
          python -m coverage report
      # Exits 1 on any failed check. One of them fails unless every line, branch and
      # function of the page's own JavaScript ran; --coverage adds the report below.
      - name: Browser checks (structure, demos, layout, dark mode, links, privacy, JS coverage)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the commits check reads the GitHub API
        run: |
          python -m playwright install --with-deps chromium
          python tests/check_site.py --coverage coverage.html
      - name: Keep the JavaScript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: coverage.html
          if-no-files-found: ignore
